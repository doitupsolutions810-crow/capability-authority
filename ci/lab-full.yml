name: full-suite

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: .
      PRODUCTION: "0"
      SPIFFE_REQUIRED: "0"
      ALLOW_ADMIN_DESTRUCTIVE_ACTIONS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lab deps + pytest
        run: python -m pip install --upgrade pip && pip install -r requirements-lab.txt pytest
      - name: Full test suite (all of tests/, not just the lab subset)
        run: python -m pytest tests/ -q
