name: lab

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: .
      PRODUCTION: "0"
      SPIFFE_REQUIRED: "0"
      ALLOW_ADMIN_DESTRUCTIVE_ACTIONS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lab deps
        run: python -m pip install --upgrade pip && pip install -r requirements-lab.txt
      - name: Lab tests
        run: |
          python tests/test_plane.py
          python tests/test_evidence_receipt_spiffe.py
          python tests/test_agents.py
      - name: Hands + agent demos
        run: |
          python scripts/demo_hands.py
          python scripts/demo_agents.py
          python scripts/demo_production_profile.py || true

  slim-probe:
    runs-on: ubuntu-slim
    steps:
      - name: Report hosted slim pool
        run: |
          echo "runner=${RUNNER_NAME:-none} os=${RUNNER_OS:-none} arch=${RUNNER_ARCH:-none}"
          uname -a
