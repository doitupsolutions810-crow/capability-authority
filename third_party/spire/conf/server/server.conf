server {
    bind_address = "127.0.0.1"
    bind_port = "18081"
    trust_domain = "prod"
    data_dir = "/tmp/spire-lab/server"
    socket_path = "/tmp/spire-lab/server/private/api.sock"
    log_level = "INFO"
    ca_ttl = "168h"
    default_x509_svid_ttl = "1h"
    ca_subject {
        country = ["US"]
        organization = ["CapabilityAuthority"]
        common_name = ""
    }
}
plugins {
    DataStore "sql" {
        plugin_data {
            database_type = "sqlite3"
            connection_string = "/tmp/spire-lab/server/datastore.sqlite3"
        }
    }
    KeyManager "disk" { plugin_data { keys_path = "/tmp/spire-lab/server/keys.json" }
    }
    NodeAttestor "join_token" { plugin_data {} }
}
