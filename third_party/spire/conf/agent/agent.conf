agent {
    data_dir = "/tmp/spire-lab/agent"
    log_level = "INFO"
    trust_domain = "prod"
    server_address = "127.0.0.1"
    server_port = "18081"
    socket_path = "/tmp/spire-lab/sockets/agent.sock"
    insecure_bootstrap = true
}
plugins {
    KeyManager "disk" {
        plugin_data { directory = "/tmp/spire-lab/agent" }
    }
    NodeAttestor "join_token" { plugin_data {} }
    WorkloadAttestor "unix" { plugin_data {} }
}
